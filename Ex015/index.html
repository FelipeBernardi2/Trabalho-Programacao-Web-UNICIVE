<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 15</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="produto">
            <img src="assets/notebook.webp" alt="Novo produto">

            <h1>Notebook Pro</h1>

            <p class="lancamento">
                Lançamento:
                <time datetime="2026-10-15">15 de outubro de 2026</time>
            </p>

            <p class="descricao">
                Conheça a nova geração do nosso produto, desenvolvida para oferecer
                mais desempenho, praticidade e tecnologia.
            </p>

            <div class="recursos">
                <h2>Recursos</h2>

                <ul>
                    <li>Alto desempenho</li>
                    <li>Design moderno</li>
                    <li>Longa duração da bateria</li>
                    <li>Conectividade avançada</li>
                </ul>
            </div>

            <form>
                <h2>Pré-venda</h2>

                <label for="nome">Nome:</label>
                <input type="text" id="nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email">

                <button type="submit">Reservar produto</button>
            </form>

        </div>

    </div>

</body>
</html>
