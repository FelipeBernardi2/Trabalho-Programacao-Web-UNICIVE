<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Galeria de Fotos</h1>

        <div class="galeria">

            <figure>
                <a href="#foto1">
                    <img src="assets/foto1.jfif" alt="Paisagem 1">
                </a>
                <figcaption>Paisagem 1</figcaption>
            </figure>

            <figure>
                <a href="#foto2">
                    <img src="assets/foto2.jfif" alt="Paisagem 2">
                </a>
                <figcaption>Paisagem 2</figcaption>
            </figure>

            <figure>
                <a href="#foto3">
                    <img src="assets/foto3.jfif" alt="Paisagem 3">
                </a>
                <figcaption>Paisagem 3</figcaption>
            </figure>

        </div>

        <div id="foto1" class="foto-ampliada">
            <a href="#">
                <img src="assets/foto1.jfif" alt="Paisagem 1 ampliada">
            </a>
        </div>

        <div id="foto2" class="foto-ampliada">
            <a href="#">
                <img src="assets/foto2.jfif" alt="Paisagem 2 ampliada">
            </a>
        </div>

        <div id="foto3" class="foto-ampliada">
            <a href="#">
                <img src="assets/foto3.jfif" alt="Paisagem 3 ampliada">
            </a>
        </div>

    </div>

</body>
</html>
